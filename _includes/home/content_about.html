{% assign post = site.pages | where: "path", "about.md" | first %}

<!-- Category Content Row -->
<div class="flex flex-row items-stretch">
    <!-- Left border column -->
    <div class="w-4 border-t border-r border-black shrink-0"></div>
    <div class="flex-1 -ml-px border-t border-0 sm:border-r border-black"></div>

    <!-- Content -->
    <div class="border-t border-black min-w-0 w-full max-w-5xl flex flex-col sm:flex-row">
        <div class="sm:w-2/5 sm:border-r border-black flex flex-col justify-between p-2">
            <div class="flex flex-col gap-1">
                <div class="font-medium font-[Inter] text-2xl uppercase break-words">
                    {{ post.title }}    
                </div>
                <div class="font-[300] font-[Inter] text-base break-words">
                    {{ post.subtitle }}
                </div>
            </div>
            <div class="flex flex-row justify-center pt-4">
                <div class="w-full max-w-3xs aspect-square rounded-full overflow-hidden bg-[radial-gradient(#cccccc_1px,transparent_1px)] bg-[size:10px_10px] bg-white">
                    <img src="{{ post.thumbnail }}" class="w-full h-full object-cover opacity-0" onload="this.style.opacity = 1"/>
                </div>
            </div>
            <div></div>
        </div>
        <div class="sm:flex-1 border-t sm:border-t-0 border-black flex flex-col justify-between items-center p-2">
            <div class="markdown w-full">
                {{ post.content | markdownify }}
            </div>
            <div class="markdown w-full">
                {{ post.contact | markdownify }}
            </div>
        </div>
    </div>
    <div class="flex-1 -mr-px border-t border-0 sm:border-l border-black"></div>

    <!-- Right border column -->
    <div class="w-4 border-t border-l border-black shrink-0"></div>
</div>
