{% assign post = site.pages | where: "path", "about.md" | first %}

<!-- Category Content Row -->
<div class="flex flex-row items-stretch">
    <!-- Left border column -->
    <div class="w-4 border-t border-r border-black shrink-0"></div>
    
    <!-- Content -->
    <div class="border-t border-black flex-1 flex flex-col sm:flex-row">
        <div class="sm:w-1/3 xl:w-1/3 border-b sm:border-b-0 sm:border-r border-black flex flex-col justify-center p-4 gap-2">
            <img class="w-full h-auto" src="{{ post.thumbnail }}">
        </div>
        <div class="sm:w-2/3 xl:w-2/3 flex flex-col justify-center items-center h-full p-2">
            <div class="markdown w-full font-normal font-[IBM_Plex_Mono] text-base p-2 text-left break-words">
                {{ post.content | markdownify }}
            </div>
        </div>
    </div>

    <!-- Right border column -->
    <div class="w-4 border-t border-l border-black shirnk-0"></div>
</div>
