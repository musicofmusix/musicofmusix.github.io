{% assign post = site.pages | where: "path", "about.md" | first %}

<!-- Category Content Row -->
<div class="flex flex-row items-stretch">
    <!-- Left border column -->
    <div class="w-4 border-t border-r border-black shrink-0"></div>
    
    <!-- Content -->
    <div class="border-t border-black flex-1 flex flex-col sm:flex-row">
        <div class="sm:w-1/2 xl:w-1/3 border-b sm:border-b-0 sm:border-r border-black flex flex-col justify-between p-4">
            <div class="flex flex-col gap-1">
                <div class="font-medium font-[Inter] text-2xl uppercase break-words">
                    {{ post.title }}
                </div>
                <div class="font-normal font-[IBM_Plex_Mono] text-sm break-words">
                    {{ post.subtitle }}
                </div>
            </div>
            <div class="flex flex-row justify-center pt-4">
                <img class="w-full max-w-3xs h-auto" src="{{ post.thumbnail }}">
            </div>
            <div></div>
        </div>
        <div class="sm:w-1/2 xl:w-2/3 flex flex-col justify-start items-center h-full p-4">
            <div class="markdown w-full font-normal font-[IBM_Plex_Mono] text-base text-left break-words">
                {{ post.content | markdownify }}
            </div>
        </div>
    </div>

    <!-- Right border column -->
    <div class="w-4 border-t border-l border-black shirnk-0"></div>
</div>
