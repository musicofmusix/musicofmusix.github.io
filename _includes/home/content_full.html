{% assign category = include.category %}
{% for post in site.categories[category] %}
    <!-- Category Content Row -->
    <div class="flex flex-row items-stretch">
        <!-- Left border column -->
        <div class="w-4 border-t border-r border-black shrink-0"></div>
        
        <!-- Content -->
        <div class="border-t border-black flex-1 flex flex-col sm:flex-row">
            <div class="sm:w-2/6 sm:border-r border-black flex flex-col justify-between p-2 gap-2">
                <div class="flex flex-col gap-1">
                    <div class="flex flex-row items-center">
                        <div class="w-1.5 h-1.5 bg-black mr-2"></div>
                        <div class="font-[300] font-[Inter] text-sm break-words">
                            {{ post.date | date: "%Y-%m-%d" }}
                        </div>
                    </div>
                    <div class="font-medium font-[Inter] text-2xl uppercase break-words">
                        {{ post.title }}
                    </div>
                    <div class="font-[300] font-[Inter] text-base break-words">
                        {{ post.subtitle }}
                    </div>
                </div>
                <div class="w-full overflow-hidden bg-[radial-gradient(#cccccc_1px,transparent_1px)] bg-[size:10px_10px] bg-white">
                    <img src="{{ post.thumbnail }}" class="w-full h-full object-cover opacity-0" onload="this.style.opacity = 1"/>
                </div>
                <div class="font-[300] font-[Inter] text-base break-words">
                    {{ post.comment }}
                </div>
            </div>
            <div class="sm:w-3/6 border-t sm:border-r sm:border-t-0 border-black flex flex-col justify-between items-center p-2 h-full">
                <!-- Text -->
                <div class="markdown w-full font-[300] font-[Inter] text-justify break-words">
                    {{ post.abstract | markdownify }}
                </div>
            </div>
            <a href="{{ post.url }}" class="sm:w-1/6 border-t sm:border-t-0 flex flex-col justify-between p-2 h-full text-black bg-neutral-200 hover:text-white hover:bg-black">
                <!-- Top-left text -->
                <div class="font-medium font-[Inter] text-2xl self-start uppercase">
                    See More
                </div>

                <!-- Bottom-right arrow -->
                <svg xmlns="http://www.w3.org/2000/svg" 
                    viewBox="0 0 416 416" fill="currentColor"
                    class="w-16 h-16 self-end">
                    <g transform="matrix(1,0,0,1,-812.451,-784.734)">
                        <g transform="matrix(0.46608,0.46608,-0.707107,0.707107,1037.7,-418.374)">
                            <path d="M1100,1043.6L1100,976.4L1748.84,976.4L1481.22,800L1621.4,800L1940,1010L1621.4,1220L1481.22,1220L1748.84,1043.6L1100,1043.6Z"/>
                        </g>
                    </g>
                </svg>
            </a>
        </div>

        <!-- Right border column -->
        <div class="w-4 border-t border-l border-black shirnk-0"></div>
    </div>
{% endfor %}
